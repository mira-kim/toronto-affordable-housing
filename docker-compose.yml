services:
  web:
    build: .
    command: gunicorn --workers 1 --bind 0.0.0.0:5001 server:app
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ./data:/app/data
    env_file: .env
    restart: always

  poller:
    build: .
    command: python poller.py
    volumes:
      - ./data:/app/data
    env_file: .env
    restart: always
